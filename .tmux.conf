# Terminal capabilities
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 10
set -g focus-events on

# Ergonomics
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# Splits keep the current pane's working directory.
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Prefix + H/J/K/L resizes panes in five-cell increments.
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Ctrl-h/j/k/l crosses tmux panes and Neovim splits without a mode switch.
is_neovim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_neovim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_neovim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_neovim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_neovim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_neovim" "send-keys C-\\" "select-pane -l"

# Clean, low-contrast status bar.
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1f2335,fg=#a9b1d6"
set -g status-left-length 30
set -g status-right-length 80
set -g status-left "#[bold,fg=#7aa2f7] #S #[default]"
set -g status-right "#[fg=#565f89]#(whoami)@#H #[fg=#7dcfff]%Y-%m-%d %H:%M "
setw -g window-status-format " #[fg=#565f89]#I:#W "
setw -g window-status-current-format " #[bold,fg=#bb9af7]#I:#W "
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7"
